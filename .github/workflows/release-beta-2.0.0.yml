name: Release v2.0.1 Beta

on:
  push:
    branches: ['feature/seo-suite-v2']
    paths:
      - '.github/release-beta-2.0.1-b1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, json, libxml, mbstring, simplexml, zip
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Validate JTL naming and build
        run: |
          php -r '
            $x=simplexml_load_file("plugin/MGD_SEOoverride_Plugin/info.xml");
            if(!$x){exit(1);}
            if(!preg_match("/^[\\w()\\- ]+$/u",(string)$x->Name)){fwrite(STDERR,"invalid plugin Name\n");exit(2);}
            foreach($x->Install->Adminmenu->Customlink as $l){if(!preg_match("/^[a-zA-Z0-9_\\- ]+$/D",(string)$l->Name)){fwrite(STDERR,"invalid customlink Name\n");exit(3);}}
            foreach($x->Install->Adminmenu->Settingslink->Setting as $s){
              if(!preg_match("/^[a-zA-Z0-9_-]+$/D",(string)$s->Name)){fwrite(STDERR,"invalid setting Name: ".(string)$s->Name."\n");exit(4);}
              if(!preg_match("/^[a-zA-Z0-9_-]+$/D",(string)$s->ValueName)){fwrite(STDERR,"invalid ValueName\n");exit(5);}
            }
          '
          find plugin/MGD_SEOoverride_Plugin -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q '\$this->execute(' plugin/MGD_SEOoverride_Plugin/Migrations/Migration20260913000100.php
          grep -q 'kPluginAdminMenu' plugin/MGD_SEOoverride_Plugin/adminmenu/_common.php
          grep -q 'plugin-tab-' plugin/MGD_SEOoverride_Plugin/adminmenu/_common.php
          grep -q 'SafePageSpeedBoost' plugin/MGD_SEOoverride_Plugin/Bootstrap.php
          grep -q 'Marketing_PageSpeed_Boost' plugin/MGD_SEOoverride_Plugin/info.xml
          bash scripts/build-release.sh 2.0.1 true false
          unzip -l release/MGD_JTL_SEO-2.0.1.zip | grep -q 'MGD_SEOoverride_Plugin/info.xml'
          unzip -l release/MGD_JTL_SEO-2.0.1.zip | grep -q 'MGD_SEOoverride_Plugin/src/SafePageSpeedBoost.php'
          unzip -l release/MGD_JTL_SEO-2.0.1.zip | grep -q 'MGD_SEOoverride_Plugin/Migrations/Migration20260913000100.php'
          unzip -l release/MGD_JTL_SEO-2.0.1.zip | grep -q 'locale/de-DE/base.mo'
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.1-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            release/MGD_JTL_SEO-2.0.1.zip \
            release/MGD_JTL_SEO-2.0.1.zip.sha256 \
            release/MGD_JTL_SEO-2.0.1.manifest.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MGD JTL SEO & PageSpeed v2.0.1 Beta 1" \
            --notes "PageSpeed-Fokusbuild: neuer Safe PageSpeed Boost mit erweiterter OPC-LCP-Erkennung für CSS/::before-Hintergründe, automatischen intrinsischen Bildabmessungen gegen CLS und konservativem Lazy Loading unterhalb des sichtbaren Bereichs. Zusätzlich gibt es einen optionalen Marketing- & Tracking-Boost für GTM/gtag/Analytics und Smarketer. Zahlungs-, Checkout-, Consent- und CAPTCHA-Skripte bleiben geschützt. Interne Plugin-Version 2.0.1 ermöglicht ein sauberes Update von 2.0.0."
