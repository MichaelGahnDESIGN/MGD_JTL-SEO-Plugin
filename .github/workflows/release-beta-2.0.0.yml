name: Release v2.0.0 Beta

on:
  push:
    branches: ['feature/seo-suite-v2']
    paths:
      - '.github/release-beta-2.0.0-b3'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, json, libxml, mbstring, simplexml, zip
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Validate JTL naming and build
        run: |
          php -r '
            $x=simplexml_load_file("plugin/MGD_SEOoverride_Plugin/info.xml");
            if(!$x){exit(1);}
            if(!preg_match("/^[a-zA-Z0-9_]+$/D",(string)$x->Name)){fwrite(STDERR,"invalid plugin Name\n");exit(2);}
            foreach($x->Install->Adminmenu->Customlink as $l){if(!preg_match("/^[a-zA-Z0-9_-]+$/D",(string)$l->Name)){fwrite(STDERR,"invalid customlink Name\n");exit(3);}}
            foreach($x->Install->Adminmenu->Settingslink->Setting as $s){
              if(!preg_match("/^[a-zA-Z0-9_-]+$/D",(string)$s->Name)){fwrite(STDERR,"invalid setting Name: ".(string)$s->Name."\n");exit(4);}
              if(!preg_match("/^[a-zA-Z0-9_-]+$/D",(string)$s->ValueName)){fwrite(STDERR,"invalid ValueName\n");exit(5);}
            }
          '
          bash scripts/build-release.sh 2.0.0 true false
          unzip -l release/MGD_JTL_SEO-2.0.0.zip | grep -q 'locale/de-DE/base.mo'
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0-beta.3"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            release/MGD_JTL_SEO-2.0.0.zip \
            release/MGD_JTL_SEO-2.0.0.zip.sha256 \
            release/MGD_JTL_SEO-2.0.0.manifest.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MGD JTL SEO & PageSpeed v2.0.0 Beta 3" \
            --notes "Korrigierter JTL-Shop-Testbuild. Sämtliche technischen Plugin-, Customlink-, Setting- und ValueName-Bezeichner entsprechen jetzt den dokumentierten JTL-Konventionen. Die sichtbaren Settings werden über gettext lokalisiert. CI prüft diese Regeln künftig vor jedem Release. Diese Version ersetzt Beta 2 für den Onvis-Test."
