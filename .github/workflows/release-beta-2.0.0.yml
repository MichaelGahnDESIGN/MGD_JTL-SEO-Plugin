name: Release v2.0.0 Beta

on:
  push:
    branches: ['feature/seo-suite-v2']
    paths:
      - '.github/release-beta-2.0.0-b2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, json, libxml, mbstring, simplexml, zip
      - name: Validate JTL naming and build
        run: |
          php -r '$x=simplexml_load_file("plugin/MGD_SEOoverride_Plugin/info.xml"); if(!$x){exit(1);} if(!preg_match("/^[a-zA-Z0-9_]+$/D",(string)$x->Name)){fwrite(STDERR,"invalid plugin Name\n");exit(2);} foreach($x->Install->Adminmenu->Customlink as $l){if(!preg_match("/^[a-zA-Z0-9_-]+$/D",(string)$l->Name)){fwrite(STDERR,"invalid customlink Name\n");exit(3);}}'
          bash scripts/build-release.sh 2.0.0 true false
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0-beta.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            release/MGD_JTL_SEO-2.0.0.zip \
            release/MGD_JTL_SEO-2.0.0.zip.sha256 \
            release/MGD_JTL_SEO-2.0.0.manifest.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MGD JTL SEO & PageSpeed v2.0.0 Beta 2" \
            --notes "Korrigierter JTL-Shop-Testbuild. Behebt Fehlercode 6 durch strikt JTL-konforme Plugin- und Adminlink-Namen und ergänzt CI-Prüfungen, damit solche Namensfehler künftig vor dem Release erkannt werden. Enthält weiterhin die komplette 2.0-Suite mit Technical SEO, PageSpeed-Verlauf, Crawler, 404-Monitor, Tracking-/Drittanbieter-Delay, CSS-Diagnose, Critical-CSS-Unterstützung, Cache-Konfigurator und Bildoptimierung mit Backup."
