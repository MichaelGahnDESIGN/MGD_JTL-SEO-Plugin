name: JTL Shop 5.7 Compatibility

on:
  push:
    branches: ['feature/seo-suite-v2']
    paths:
      - '.github/workflows/jtl-5.7-compat.yml'
      - '.github/jtl-5.7-compat-trigger'
      - 'plugin/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jtl57:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, json, libxml, mbstring, simplexml, zip

      - name: Clone official JTL Shop 5.7.3 core
        run: |
          git clone --depth 1 --branch v5.7.3 https://gitlab.com/jtl-software/jtl-shop/core.git /tmp/jtl
          echo "JTL commit: $(git -C /tmp/jtl rev-parse HEAD)"

      - name: Inspect official JTL plugin internals
        run: |
          echo '===== JTL Migration.php ====='
          sed -n '1,240p' /tmp/jtl/includes/src/Plugin/Migration.php
          echo '===== JTL MigrationManager.php ====='
          sed -n '1,320p' /tmp/jtl/includes/src/Plugin/Admin/Installation/MigrationManager.php
          echo '===== JTL Bootstrapper validation item ====='
          sed -n '1,220p' /tmp/jtl/includes/src/Plugin/Admin/Validation/Items/Bootstrapper.php
          echo '===== JTL base Bootstrapper ====='
          sed -n '1,280p' /tmp/jtl/includes/src/Plugin/Bootstrapper.php
          echo '===== JTL Installer migration/update section ====='
          sed -n '240,470p' /tmp/jtl/includes/src/Plugin/Admin/Installation/Installer.php
          echo '===== JTL PluginValidator ====='
          sed -n '1,180p' /tmp/jtl/includes/src/Plugin/Admin/Validation/PluginValidator.php
          echo '===== Autoload/composer locations ====='
          find /tmp/jtl -maxdepth 4 \( -name composer.json -o -name autoload.php \) -print | sort | head -n 100

      - name: PHP syntax
        run: find plugin/MGD_SEOoverride_Plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate migration source contract
        run: |
          php <<'PHP'
          <?php
          $file = getcwd() . '/plugin/MGD_SEOoverride_Plugin/Migrations/Migration20260913000100.php';
          $src = file_get_contents($file);
          $checks = [
              'namespace Plugin\\MGD_SEOoverride_Plugin\\Migrations;' => 'migration namespace',
              'extends Migration implements IMigration' => 'migration inheritance',
              'function up' => 'up method',
              'function down' => 'down method',
          ];
          foreach ($checks as $needle => $label) {
              if (strpos($src, $needle) === false) {
                  fwrite(STDERR, "Missing $label\n"); exit(10);
              }
          }
          echo "Migration source contract OK\n";
          PHP

      - name: Validate info.xml conventions and referenced files
        run: |
          php <<'PHP'
          <?php
          $root = getcwd() . '/plugin/MGD_SEOoverride_Plugin';
          $x = simplexml_load_file($root . '/info.xml');
          if (!$x) exit(20);
          $id = (string)$x->PluginID;
          if ($id !== basename($root)) {
              fwrite(STDERR, "PluginID/folder mismatch\n"); exit(21);
          }
          if (!preg_match('/^[A-Za-z0-9_]+$/D', (string)$x->Name)) exit(22);
          if (!preg_match('/^[A-Za-z0-9_]+$/D', $id)) exit(23);
          foreach ($x->Install->Adminmenu->Customlink as $link) {
              $name = (string)$link->Name;
              $file = (string)$link->Filename;
              if (!preg_match('/^[A-Za-z0-9_-]+$/D', $name)) {
                  fwrite(STDERR, "Invalid customlink name: $name\n"); exit(24);
              }
              if (!is_file($root . '/adminmenu/' . $file)) {
                  fwrite(STDERR, "Missing adminmenu file: $file\n"); exit(25);
              }
          }
          foreach ($x->Install->Adminmenu->Settingslink->Setting as $setting) {
              $name = (string)$setting->Name;
              $valueName = (string)$setting->ValueName;
              if (!preg_match('/^[A-Za-z0-9_-]+$/D', $name)) {
                  fwrite(STDERR, "Invalid setting name: $name\n"); exit(26);
              }
              if ($valueName === '' || !preg_match('/^[A-Za-z0-9_-]+$/D', $valueName)) {
                  fwrite(STDERR, "Invalid ValueName: $valueName\n"); exit(27);
              }
          }
          echo "info.xml and referenced files OK\n";
          PHP
