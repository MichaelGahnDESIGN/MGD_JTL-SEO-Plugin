name: JTL Shop 5.7 Compatibility

on:
  push:
    branches: ['feature/seo-suite-v2']
    paths:
      - '.github/workflows/jtl-5.7-compat.yml'
      - '.github/jtl-5.7-compat-trigger*'
      - 'plugin/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jtl57:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, json, libxml, mbstring, simplexml, zip

      - name: Clone official JTL Shop 5.7.3 core
        run: |
          git clone --depth 1 --branch v5.7.3 https://gitlab.com/jtl-software/jtl-shop/core.git /tmp/jtl
          echo "JTL commit: $(git -C /tmp/jtl rev-parse HEAD)"

      - name: Inspect exact JTL migration API
        run: |
          echo '===== JTL Plugin Migration.php ====='
          cat /tmp/jtl/includes/src/Plugin/Migration.php
          echo '===== JTL Update Migration.php ====='
          sed -n '1,360p' /tmp/jtl/includes/src/Update/Migration.php
          echo '===== JTL IMigration.php ====='
          cat /tmp/jtl/includes/src/Update/IMigration.php
          echo '===== JTL Plugin MigrationHelper.php ====='
          sed -n '1,360p' /tmp/jtl/includes/src/Plugin/MigrationHelper.php
          echo '===== JTL MigrationManager relevant block ====='
          sed -n '150,330p' /tmp/jtl/includes/src/Plugin/Admin/Installation/MigrationManager.php
          echo '===== JTL bootstrap validation ====='
          cat /tmp/jtl/includes/src/Plugin/Admin/Validation/Items/Bootstrapper.php
          echo '===== JTL upload/install references ====='
          grep -RniE 'plugin.*upload|upload.*plugin|json_encode|jsonResponse|INVALID_MIGRATION|pluginPlausiIntern' /tmp/jtl/admin /tmp/jtl/includes/src/Plugin 2>/dev/null | head -n 400 || true

      - name: PHP syntax
        run: find plugin/MGD_SEOoverride_Plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate migration structure against JTL mapping
        run: |
          php <<'PHP'
          <?php
          $file = getcwd() . '/plugin/MGD_SEOoverride_Plugin/Migrations/Migration20260913000100.php';
          $base = basename($file, '.php');
          if (!preg_match('/^Migration([0-9]{14})$/D', $base, $m)) {
              fwrite(STDERR, "Invalid migration filename: $base\n"); exit(10);
          }
          $expected = 'Plugin\\MGD_SEOoverride_Plugin\\Migrations\\' . $base;
          $src = file_get_contents($file);
          foreach ([
              'namespace Plugin\\MGD_SEOoverride_Plugin\\Migrations;' => 'namespace',
              'final class ' . $base . ' extends Migration implements IMigration' => 'class declaration',
              'function up' => 'up method',
              'function down' => 'down method',
          ] as $needle => $label) {
              if (strpos($src, $needle) === false) {
                  fwrite(STDERR, "Missing $label for $expected\n"); exit(11);
              }
          }
          echo "Migration mapping OK: $expected\n";
          PHP

      - name: Validate info.xml conventions and referenced files
        run: |
          php <<'PHP'
          <?php
          $root = getcwd() . '/plugin/MGD_SEOoverride_Plugin';
          $x = simplexml_load_file($root . '/info.xml');
          if (!$x) exit(20);
          $id = (string)$x->PluginID;
          if ($id !== basename($root)) { fwrite(STDERR, "PluginID/folder mismatch\n"); exit(21); }
          if (!preg_match('/^[A-Za-z0-9_]+$/D', (string)$x->Name)) exit(22);
          if (!preg_match('/^[A-Za-z0-9_]+$/D', $id)) exit(23);
          foreach ($x->Install->Adminmenu->Customlink as $link) {
              $name = (string)$link->Name; $file = (string)$link->Filename;
              if (!preg_match('/^[A-Za-z0-9_-]+$/D', $name)) { fwrite(STDERR, "Invalid customlink: $name\n"); exit(24); }
              if (!is_file($root . '/adminmenu/' . $file)) { fwrite(STDERR, "Missing adminmenu: $file\n"); exit(25); }
          }
          foreach ($x->Install->Adminmenu->Settingslink->Setting as $setting) {
              $name=(string)$setting->Name; $valueName=(string)$setting->ValueName;
              if (!preg_match('/^[A-Za-z0-9_-]+$/D', $name)) { fwrite(STDERR, "Invalid setting: $name\n"); exit(26); }
              if ($valueName==='' || !preg_match('/^[A-Za-z0-9_-]+$/D', $valueName)) { fwrite(STDERR, "Invalid ValueName: $valueName\n"); exit(27); }
          }
          echo "info.xml OK\n";
          PHP
