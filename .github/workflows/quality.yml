name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: simplexml
          coverage: none
      - name: PHP syntax
        run: find plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate info.xml
        run: php -r '$x=simplexml_load_file("plugin/MGD_SEOoverride_Plugin/info.xml"); if ($x===false) { exit(1); } echo "info.xml OK\n";'
      - name: Build install ZIP
        run: bash scripts/build-release.sh 1.1.0
