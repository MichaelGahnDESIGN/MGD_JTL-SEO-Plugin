name: Quality

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, json, libxml, mbstring, simplexml, zip
      - name: PHP syntax
        run: find plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate info.xml and version
        run: |
          php -r '$x=simplexml_load_file("plugin/MGD_SEOoverride_Plugin/info.xml"); if ($x===false) { exit(1); } if ((string)$x->PluginID !== "MGD_SEOoverride_Plugin") { exit(2); } if (!preg_match("/^\\d+\\.\\d+\\.\\d+$/", (string)$x->Version)) { exit(3); } echo "info.xml OK, version ".$x->Version."\n";'
      - name: Build install ZIP and update manifest
        run: bash scripts/build-release.sh
      - name: Validate ZIP root
        run: |
          ZIP="$(find release -name 'MGD_JTL_SEO-*.zip' -type f | head -n1)"
          test -n "$ZIP"
          unzip -l "$ZIP" | grep -q 'MGD_SEOoverride_Plugin/info.xml'
      - name: Validate release manifest
        run: |
          MANIFEST="$(find release -name '*.manifest.json' -type f | head -n1)"
          test -n "$MANIFEST"
          php -r '$j=json_decode(file_get_contents($argv[1]), true, 8, JSON_THROW_ON_ERROR); foreach(["plugin_id","version","min_shop_version","sha256","requires_jtl_update","self_update_safe"] as $k){if(!array_key_exists($k,$j)){fwrite(STDERR,"missing $k\n"); exit(1);}} echo "manifest OK\n";' "$MANIFEST"
